[project]
name = "tender-lens-system-tests"
version = "0.1.0"
description = "Системные тесты Tender Lens: проверка развёрнутой системы как чёрного ящика по HTTP"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-ra --strict-markers"
markers = [
    "contract: соответствие API зафиксированному контракту OpenAPI",
]
