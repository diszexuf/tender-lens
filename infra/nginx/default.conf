server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 5m;

    # Резолвим api через DNS Docker при каждом запросе (с кэшем 10 с), а не один раз
    # при старте: иначе после пересоздания контейнера api nginx отдаёт 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # Прогресс расчёта (Server-Sent Events): без буферизации и с длинным таймаутом
    location ~ ^/api/calculations/[^/]+/events$ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: все остальные пути отдаются index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
